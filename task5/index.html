<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="campus-header p-4 mb-4">
      <a href="../index.html" class="back-btn d-inline-block mb-2">&larr; Back</a>
      <h1 class="h3 mb-1">Smart Campus Parking Management</h1>
      <p class="mb-0 opacity-75">Real-time parking access control system</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card campus-card">
          <div class="card-header bg-white fw-semibold">Vehicle & Owner</div>
          <div class="card-body" id="vehicleInfo"></div>
        </div>
        <div class="card campus-card mt-4">
          <div class="card-header bg-white fw-semibold">Adjust Scenario (Demo)</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Owner Type</label>
              <select class="form-select" id="ownerType">
                <option value="faculty">Faculty</option>
                <option value="student">Student</option>
                <option value="staff">Staff</option>
                <option value="visitor">Visitor</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Parking Area</label>
              <select class="form-select" id="parkingArea"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Permit Status</label>
              <select class="form-select" id="permitStatus">
                <option value="valid">Valid Permit</option>
                <option value="expired">Expired Permit</option>
                <option value="none">No Permit</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">University ID Valid</label>
              <select class="form-select" id="idValid">
                <option value="true">Yes</option>
                <option value="false">No</option>
              </select>
            </div>
            <button class="btn btn-primary w-100" onclick="reevaluate()">Check Parking Access</button>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card campus-card mb-4">
          <div class="card-header bg-white fw-semibold">Parking Area Information</div>
          <div class="card-body" id="areaInfo"></div>
        </div>
        <div class="row g-4">
          <div class="col-md-6">
            <div class="card campus-card">
              <div class="card-header bg-white fw-semibold">Access Checks</div>
              <div class="card-body" id="accessChecks"></div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card campus-card">
              <div class="card-header bg-white fw-semibold">Parking Decision</div>
              <div class="card-body" id="parkingDecision"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
