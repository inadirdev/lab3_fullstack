<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration Eligibility</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="page-header p-4 mb-4">
      <a href="../index.html" class="back-btn d-inline-block mb-2">&larr; Back</a>
      <h1 class="h3 mb-1">Course Registration Eligibility System</h1>
      <p class="mb-0 opacity-75">Edit student and course details to check registration eligibility</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="edit-panel p-4 mb-4">
          <h6 class="fw-semibold mb-3">Student Details</h6>
          <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" class="form-control" id="studentName">
          </div>
          <div class="mb-3">
            <label class="form-label">Student ID</label>
            <input type="text" class="form-control" id="studentId">
          </div>
          <div class="mb-3">
            <label class="form-label">Current Semester</label>
            <input type="number" class="form-control" id="studentSemester" min="1" max="8">
          </div>
          <div class="mb-3">
            <label class="form-label">CGPA</label>
            <input type="number" class="form-control" id="studentCgpa" step="0.01" min="0" max="4">
          </div>
          <div class="mb-3">
            <label class="form-label">Academic Standing</label>
            <select class="form-select" id="academicStanding">
              <option value="Good Standing">Good Standing</option>
              <option value="Probation">Probation</option>
              <option value="Suspended">Suspended</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Fee Status</label>
            <select class="form-select" id="feePaid">
              <option value="false">Outstanding</option>
              <option value="true">Paid</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Completed Courses</label>
            <input type="text" class="form-control" id="completedCourses" placeholder="CS101, CS201, CS301">
            <small class="text-muted">Separate course codes with commas</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Previous Course Grade</label>
            <input type="text" class="form-control" id="previousGrade">
          </div>
        </div>

        <div class="edit-panel p-4">
          <h6 class="fw-semibold mb-3">Course Details</h6>
          <div class="mb-3">
            <label class="form-label">Course Code</label>
            <input type="text" class="form-control" id="courseCode">
          </div>
          <div class="mb-3">
            <label class="form-label">Course Name</label>
            <input type="text" class="form-control" id="courseName">
          </div>
          <div class="mb-3">
            <label class="form-label">Required Semester</label>
            <input type="number" class="form-control" id="courseSemester" min="1" max="8">
          </div>
          <div class="mb-3">
            <label class="form-label">Minimum CGPA</label>
            <input type="number" class="form-control" id="minCgpa" step="0.01" min="0" max="4">
          </div>
          <div class="mb-3">
            <label class="form-label">Prerequisites</label>
            <input type="text" class="form-control" id="prerequisites" placeholder="CS301, MATH201">
            <small class="text-muted">Separate course codes with commas</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Seats Available</label>
            <input type="number" class="form-control" id="seatsAvailable" min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">Total Seats</label>
            <input type="number" class="form-control" id="totalSeats" min="1">
          </div>
          <button class="btn btn-success w-100" onclick="evaluateEligibility()">Check Eligibility</button>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <div class="card info-card">
              <div class="card-header bg-white fw-semibold">Student Information</div>
              <div class="card-body" id="studentDetails"></div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card info-card">
              <div class="card-header bg-white fw-semibold">Course Information</div>
              <div class="card-body" id="courseDetails"></div>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-md-7">
            <div class="card info-card">
              <div class="card-header bg-white fw-semibold">Eligibility Checks</div>
              <div class="card-body" id="eligibilityChecks"></div>
            </div>
          </div>
          <div class="col-md-5">
            <div class="card info-card">
              <div class="card-header bg-white fw-semibold">Registration Decision</div>
              <div class="card-body" id="registrationDecision"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
