<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="dashboard-header p-4 mb-4">
      <a href="../index.html" class="back-btn d-inline-block mb-2">&larr; Back</a>
      <h1 class="h3 mb-1">Student Performance Dashboard</h1>
      <p class="mb-0 opacity-75">Edit student details below to analyze academic performance</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="edit-panel p-4">
          <h6 class="fw-semibold mb-3">Student Details</h6>
          <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" class="form-control" id="nameInput">
          </div>
          <div class="mb-3">
            <label class="form-label">Student ID</label>
            <input type="text" class="form-control" id="idInput">
          </div>
          <div class="mb-3">
            <label class="form-label">Program</label>
            <input type="text" class="form-control" id="programInput">
          </div>
          <div class="mb-3">
            <label class="form-label">Semester</label>
            <input type="number" class="form-control" id="semesterInput" min="1" max="8">
          </div>
          <hr>
          <h6 class="fw-semibold mb-3">Performance Data</h6>
          <div class="mb-3">
            <label class="form-label">Marks Obtained</label>
            <input type="number" class="form-control" id="marksInput" min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">Total Marks</label>
            <input type="number" class="form-control" id="totalMarksInput" min="1">
          </div>
          <div class="mb-3">
            <label class="form-label">Attendance (%)</label>
            <input type="number" class="form-control" id="attendanceInput" min="0" max="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Assignment (%)</label>
            <input type="number" class="form-control" id="assignmentInput" min="0" max="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Quiz (%)</label>
            <input type="number" class="form-control" id="quizInput" min="0" max="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Examination (%)</label>
            <input type="number" class="form-control" id="examinationInput" min="0" max="100">
          </div>
          <button class="btn btn-primary w-100" onclick="analyzePerformance()">Analyze Performance</button>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="row g-3 mb-4" id="studentInfo"></div>

        <div class="row g-4">
          <div class="col-md-7">
            <div class="card stat-card">
              <div class="card-header bg-white fw-semibold">Performance Breakdown</div>
              <div class="card-body" id="performanceBreakdown"></div>
            </div>
          </div>
          <div class="col-md-5">
            <div class="card stat-card">
              <div class="card-header bg-white fw-semibold">Overall Result</div>
              <div class="card-body text-center" id="overallResult"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
