<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Screening System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="page-header p-4 mb-4">
      <a href="../index.html" class="back-btn d-inline-block mb-2">&larr; Back</a>
      <h1 class="h3 mb-1">Scholarship Screening System</h1>
      <p class="mb-0 opacity-75">Automated eligibility analysis for scholarship applications</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card panel">
          <div class="card-header bg-white fw-semibold">Student Information</div>
          <div class="card-body" id="studentInfo"></div>
        </div>
        <div class="card panel mt-4">
          <div class="card-header bg-white fw-semibold">Adjust Values (Demo)</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">CGPA</label>
              <input type="number" class="form-control" id="cgpaInput" step="0.01" min="0" max="4">
            </div>
            <div class="mb-3">
              <label class="form-label">Attendance (%)</label>
              <input type="number" class="form-control" id="attendanceInput" min="0" max="100">
            </div>
            <div class="mb-3">
              <label class="form-label">Family Income (Rs.)</label>
              <input type="number" class="form-control" id="incomeInput" min="0" step="1000">
            </div>
            <div class="mb-3">
              <label class="form-label">Semester</label>
              <input type="number" class="form-control" id="semesterInput" min="1" max="8">
            </div>
            <button class="btn btn-success w-100" onclick="reanalyze()">Re-analyze Eligibility</button>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card panel mb-4">
          <div class="card-header bg-white fw-semibold">Eligibility Analysis</div>
          <div class="card-body" id="criteriaAnalysis"></div>
        </div>
        <div class="card panel">
          <div class="card-header bg-white fw-semibold">Final Classification</div>
          <div class="card-body" id="finalResult"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
