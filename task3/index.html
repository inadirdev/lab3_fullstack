<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="shop-header p-4 mb-4">
      <a href="../index.html" class="back-btn d-inline-block mb-2">&larr; Back</a>
      <h1 class="h3 mb-1">Order Summary</h1>
      <p class="mb-0 opacity-75">Electronic products — automatic billing calculation</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="control-panel">
          <h6 class="fw-semibold mb-3">Adjust Order (Demo)</h6>
          <div class="mb-3">
            <label class="form-label">Product</label>
            <select class="form-select" id="productSelect"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantityInput" min="1" value="1">
          </div>
          <div class="mb-3">
            <label class="form-label">Customer Type</label>
            <select class="form-select" id="customerType">
              <option value="regular">Regular</option>
              <option value="premium">Premium Member</option>
              <option value="student">Student</option>
            </select>
          </div>
          <button class="btn btn-primary w-100" onclick="recalculate()">Recalculate Order</button>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card order-card">
          <div class="card-body p-4">
            <h5 class="fw-semibold mb-4">Product Information</h5>
            <div id="productInfo"></div>

            <hr class="my-4">

            <h5 class="fw-semibold mb-3">Order Summary</h5>
            <div id="orderSummary"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
